version: "1.1"
profiles:
  # MT6768, 720x1640 panel, BGRA big-endian. 43 slots.
  # Verified against a stock logo partition of 16777216 bytes.
  # Boot splash frames are slots 0, 38 and 42 (branded full-screens); confirm
  # with a contact sheet, since the pair/set varies between devices.
  - name: mt6768-720x1640
    color_model: bgrabe
    formats:
    # boot splash + charging frames. 720x1640x4 = 4723200
    - { w: 720, h: 1640, t: "fullscreen" }
    # charging frames. 23040 = 5760*4
    - { w: 90,  h: 64,   t: "chargeframe" }
    # "%" glyph. 14592 = 3648*4
    - { w: 57,  h: 64,   t: "percent" }
    # charge digits. 11520 = 2880*4
    - { w: 45,  h: 64,   t: "digit" }
    # charge bar line. 2104 = 526*4
    - { w: 526, h: 1,    t: "line" }
